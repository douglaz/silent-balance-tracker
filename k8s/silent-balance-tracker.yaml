apiVersion: v1
kind: Namespace
metadata:
  name: silent-balance-tracker
  labels:
    name: silent-balance-tracker
---
apiVersion: v1
kind: Secret
metadata:
  name: silent-accounts
  namespace: silent-balance-tracker
type: Opaque
stringData:
  # JSON array of {name, url}. Each `url` is the full silent.link order URL —
  # the token is extracted from the path. Replace these with real values
  # (or manage out-of-band; do NOT commit real tokens here).
  accounts.json: |
    [
      { "name": "primary",   "url": "https://silent.link/order/REPLACE_ME_PRIMARY"   },
      { "name": "secondary", "url": "https://silent.link/order/REPLACE_ME_SECONDARY" }
    ]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: silent-balance-tracker-config
  namespace: silent-balance-tracker
data:
  # Non-sensitive settings only. Accounts come from the Secret via env.
  config.toml: |
    [database]
    path = "/data/silent_balance.sqlite"

    [server]
    host = "0.0.0.0"
    port = 8080

    [poller]
    interval_seconds = 300
    request_timeout_seconds = 20
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: silent-balance-tracker-data
  namespace: silent-balance-tracker
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: silent-balance-tracker
  namespace: silent-balance-tracker
  labels:
    app: silent-balance-tracker
spec:
  replicas: 1
  strategy:
    # Avoid two pods racing for the sqlite file on a RWO volume.
    type: Recreate
  selector:
    matchLabels:
      app: silent-balance-tracker
  template:
    metadata:
      labels:
        app: silent-balance-tracker
    spec:
      containers:
        - name: silent-balance-tracker
          # Pinned by digest. Source commit: 44aa61e. Also tagged :44aa61e for readability.
          image: ghcr.io/douglaz/silent-balance-tracker@sha256:99ca93186dc78f5a4225453a28fa7351f00155d43207dff6d02992e25e825ca0
          imagePullPolicy: IfNotPresent
          command: ["/bin/silent-balance-tracker"]
          args: ["serve", "--config", "/etc/silent-balance/config.toml"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "info,silent_balance_tracker=debug"
            - name: SILENT_ACCOUNTS_JSON
              valueFrom:
                secretKeyRef:
                  name: silent-accounts
                  key: accounts.json
          volumeMounts:
            - name: config
              mountPath: /etc/silent-balance
              readOnly: true
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "64Mi"
              cpu: "20m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: silent-balance-tracker-config
        - name: data
          persistentVolumeClaim:
            claimName: silent-balance-tracker-data
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: silent-balance-tracker
  namespace: silent-balance-tracker
  labels:
    app: silent-balance-tracker
spec:
  type: ClusterIP
  selector:
    app: silent-balance-tracker
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: silent-balance-tracker
  namespace: silent-balance-tracker
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - silent.galtland.io
      secretName: silent-balance-tracker-tls
  rules:
    - host: silent.galtland.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: silent-balance-tracker
                port:
                  number: 8080
