name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v22
      - run: nix develop -c cargo fmt --all -- --check
      - run: nix develop -c cargo clippy --all-targets --all-features -- -D warnings
      - run: nix develop -c cargo check --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v22
      - run: nix develop -c cargo test --all-features

  docker:
    name: Build and push docker image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    needs: [check, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image with nix
        run: |
          nix build .#dockerImage
          docker load < result

      - name: Tag and push
        run: |
          REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')
          IMAGE_ID=$(docker images silent-balance-tracker:latest --format '{{.ID}}')
          TAGS=("ghcr.io/${REPO_LOWER}:${GITHUB_SHA::7}" "ghcr.io/${REPO_LOWER}:${GITHUB_SHA}")
          if [[ "${{ github.ref }}" == "refs/heads/master" ]] || [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            TAGS+=("ghcr.io/${REPO_LOWER}:latest")
          fi
          if [[ "${{ github.ref }}" == "refs/tags/"* ]]; then
            TAGS+=("ghcr.io/${REPO_LOWER}:${GITHUB_REF##*/}")
          fi
          for TAG in "${TAGS[@]}"; do
            echo "pushing $TAG"
            docker tag "$IMAGE_ID" "$TAG"
            docker push "$TAG"
          done
